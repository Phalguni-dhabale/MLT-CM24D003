<!DOCTYPE html>
<html>
<head>
    <title>PoseNet with TensorFlow.js</title>
    <!-- Load TensorFlow.js -->
    <script src="https://cdn.jsdelivr.net/npm/@tensorflow/tfjs"></script>
    <!-- Load PoseNet -->
    <script src="https://cdn.jsdelivr.net/npm/@tensorflow-models/posenet"></script>
    <style>
        body { text-align: center; font-family: sans-serif; }
        canvas { position: absolute; top: 50px; left: 50%; width: 640px; height: 480px; transform: translateX(-50%); }
        video { position: absolute; top: 50px; left: 50%; width: 640px; height: 480px; transform: translateX(-50%); opacity: 0; }
    </style>
</head>
<body>
    <h1>Real-Time PoseNet Detection</h1>
    <video id="video" playsinline autoplay></video>
    <canvas id="canvas"></canvas>

    <script>
        const video = document.getElementById('video');
        const canvas = document.getElementById('canvas');
        const ctx = canvas.getContext('2d');

        // Setup webcam
        async function setupCamera() {
            if (!navigator.mediaDevices || !navigator.mediaDevices.getUserMedia) {
                throw new Error("Browser API navigator.mediaDevices.getUserMedia not available");
            }

            const stream = await navigator.mediaDevices.getUserMedia({
                'audio': false,
                'video': { width: 640, height: 480 }
            });
            video.srcObject = stream;

            return new Promise((resolve) => {
                video.onloadedmetadata = () => resolve(video);
            });
        }

        // Draw keypoints and skeleton
        function drawKeypoints(keypoints, minConfidence, ctx, scale = 1) {
            for (let i = 0; i < keypoints.length; i++) {
                const keypoint = keypoints[i];
                if (keypoint.score < minConfidence) continue;

                const { y, x } = keypoint.position;
                ctx.beginPath();
                ctx.arc(x * scale, y * scale, 5, 0, 2 * Math.PI);
                ctx.fillStyle = 'aqua';
                ctx.fill();
            }
        }

        function drawSkeleton(keypoints, minConfidence, ctx, scale = 1) {
            const adjacentKeyPoints = posenet.getAdjacentKeyPoints(keypoints, minConfidence);
            
            adjacentKeyPoints.forEach((keypoints) => {
                ctx.beginPath();
                ctx.moveTo(keypoints[0].position.x * scale, keypoints[0].position.y * scale);
                ctx.lineTo(keypoints[1].position.x * scale, keypoints[1].position.y * scale);
                ctx.lineWidth = 2;
                ctx.strokeStyle = 'aqua';
                ctx.stroke();
            });
        }

        // Main pose detection loop
        async function detectPoseInRealTime(video, net) {
            canvas.width = video.videoWidth;
            canvas.height = video.videoHeight;

            async function poseDetectionFrame() {
                const pose = await net.estimateSinglePose(video, {
                    flipHorizontal: false
                });

                ctx.clearRect(0, 0, canvas.width, canvas.height);
                ctx.drawImage(video, 0, 0, canvas.width, canvas.height);

                if (pose.score >= 0.1) {
                    drawKeypoints(pose.keypoints, 0.5, ctx);
                    drawSkeleton(pose.keypoints, 0.5, ctx);
                }

                requestAnimationFrame(poseDetectionFrame);
            }

            poseDetectionFrame();
        }

        // Initialize application
        async function main() {
            await setupCamera();
            video.play();
            
            // Load the PoseNet model
            const net = await posenet.load({
                architecture: 'MobileNetV1',
                outputStride: 16,
                inputResolution: { width: 640, height: 480 },
                multiplier: 0.75
            });

            detectPoseInRealTime(video, net);
        }

        main();
    </script>
</body>
</html>
